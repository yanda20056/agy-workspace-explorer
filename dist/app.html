<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Explorer</title>
  <style>
    :root,
    [data-theme="dark"] {
      --bg-primary: var(--color-background-primary, #18181b);
      --bg-secondary: var(--color-background-secondary, #202024);
      --bg-tertiary: var(--color-background-tertiary, #2a2a30);
      --text-primary: var(--color-text-primary, #ececef);
      --text-secondary: var(--color-text-secondary, #a1a1aa);
      --text-tertiary: var(--color-text-tertiary, #71717a);
      --border-primary: var(--color-border-primary, rgba(255, 255, 255, 0.1));
      --border-secondary: var(--color-border-secondary, rgba(255, 255, 255, 0.06));
      --accent: var(--color-ring-primary, #3b82f6);
      --accent-soft: rgba(59, 130, 246, 0.16);
      --menu-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
      --font-ui: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      --font-mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace);
      --syn-kw: #c084fc;
      --syn-str: #4ade80;
      --syn-num: #fb923c;
      --syn-cmt: #71717a;
      --syn-key: #60a5fa;
    }

    [data-theme="light"] {
      --bg-primary: var(--color-background-primary, #ffffff);
      --bg-secondary: var(--color-background-secondary, #f4f4f5);
      --bg-tertiary: var(--color-background-tertiary, #e4e4e7);
      --text-primary: var(--color-text-primary, #18181b);
      --text-secondary: var(--color-text-secondary, #52525b);
      --text-tertiary: var(--color-text-tertiary, #71717a);
      --border-primary: var(--color-border-primary, rgba(0, 0, 0, 0.12));
      --border-secondary: var(--color-border-secondary, rgba(0, 0, 0, 0.06));
      --accent: var(--color-ring-primary, #2563eb);
      --accent-soft: rgba(37, 99, 235, 0.12);
      --menu-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
      --syn-kw: #7e22ce;
      --syn-str: #15803d;
      --syn-num: #c2410c;
      --syn-cmt: #71717a;
      --syn-key: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 420px;
      width: 100%;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .project-select {
      flex: 1;
      min-width: 0;
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--border-primary);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .project-select:focus {
      border-color: var(--accent);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .icon-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .icon-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(59, 130, 246, 0.35);
    }

    .lang-btn,
    .mode-btn {
      width: auto;
      min-width: 28px;
      padding: 0 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.02em;
      gap: 3px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 8px;
      color: var(--text-tertiary);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      height: 28px;
      padding: 0 92px 0 28px;
      border-radius: 6px;
      border: 1px solid var(--border-primary);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.12s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input.invalid {
      border-color: var(--color-border-danger, #ef4444);
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-controls {
      position: absolute;
      right: 3px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .search-opt-btn {
      height: 20px;
      min-width: 22px;
      padding: 0 4px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--text-tertiary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .search-opt-btn:hover:not(:disabled) {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .search-opt-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(59, 130, 246, 0.38);
    }

    .search-opt-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .search-clear {
      width: 18px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      border-radius: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      padding: 0;
    }

    .search-clear.visible {
      display: inline-flex;
    }

    .search-clear:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    mark.hl {
      background: rgba(234, 179, 8, 0.28);
      color: inherit;
      border-radius: 2px;
      padding: 0 0.5px;
    }

    .subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
      padding: 0 2px;
    }

    .subbar-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
    }

    .badge {
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-size: 10.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Main horizontal split area: Left File Viewer + Right Docked File Tree */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    .tree-scroll {
      flex: 1;
      min-width: 165px;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 0 12px 0;
      background: var(--bg-primary);
    }

    .main.preview-open .tree-scroll {
      flex: none;
      width: var(--tree-width, 260px);
      max-width: 72%;
    }

    .tree-scroll::-webkit-scrollbar,
    .preview-body::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .tree-scroll::-webkit-scrollbar-thumb,
    .preview-body::-webkit-scrollbar-thumb {
      background: var(--border-primary);
      border-radius: 4px;
    }

    /* Tree rows */
    .tree-row {
      position: relative;
      display: flex;
      align-items: center;
      height: 27px;
      padding-right: 6px;
      cursor: pointer;
      color: var(--text-primary);
      transition: background 0.08s;
    }

    .tree-row:hover {
      background: var(--bg-secondary);
    }

    .tree-row.selected {
      background: var(--accent-soft);
    }

    .tree-row.project-root-row {
      height: 30px;
      font-weight: 600;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-secondary);
      border-bottom: 1px solid var(--border-secondary);
      margin-top: 4px;
    }

    .tree-row.project-root-row:first-child {
      margin-top: 0;
      border-top: none;
    }

    .tree-row.hidden-item .row-name {
      opacity: 0.65;
    }

    .chevron {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }

    .chevron.open {
      transform: rotate(90deg);
    }

    .chevron.spacer {
      visibility: hidden;
    }

    .file-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 5px;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
    }

    .row-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.8px;
    }

    .row-sub {
      margin-left: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 45%;
      font-family: var(--font-mono);
    }

    .row-actions {
      display: none;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .tree-row:hover .row-actions,
    .tree-row.selected .row-actions {
      display: inline-flex;
    }

    .mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 21px;
      min-width: 21px;
      padding: 0 5px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }

    .mini-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .mini-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(59, 130, 246, 0.35);
    }

    /* Empty / loading */
    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 12.5px;
    }

    /* Left Built-in File Viewer Pane */
    .preview-pane {
      display: none;
      flex-direction: column;
      flex: 1;
      min-width: 180px;
      min-height: 0;
      background: var(--bg-primary);
      overflow: hidden;
    }

    .main.preview-open .preview-pane {
      display: flex;
    }

    .preview-resizer {
      display: none;
      width: 5px;
      cursor: ew-resize;
      background: transparent;
      border-left: 1px solid var(--border-primary);
      flex-shrink: 0;
      transition: background 0.12s;
    }

    .main.preview-open .preview-resizer {
      display: block;
    }

    .preview-resizer:hover,
    .preview-resizer.dragging {
      background: var(--accent-soft);
    }

    /* Viewer Tab Bar */
    .preview-tabs {
      display: none;
      align-items: stretch;
      height: 32px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      overflow-x: auto;
      overflow-y: hidden;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .preview-tabs.has-tabs {
      display: flex;
    }

    .preview-tabs::-webkit-scrollbar {
      height: 3px;
    }

    .preview-tabs::-webkit-scrollbar-thumb {
      background: var(--border-primary);
    }

    .preview-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 8px 0 10px;
      min-width: 90px;
      max-width: 190px;
      height: 100%;
      border-right: 1px solid var(--border-primary);
      border-top: 2px solid transparent;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
      transition: background 0.1s, color 0.1s;
    }

    .preview-tab:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .preview-tab.active {
      background: var(--bg-primary);
      color: var(--text-primary);
      border-top-color: var(--accent);
      font-weight: 500;
    }

    .preview-tab-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-tertiary);
      font-size: 13px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .preview-tab:hover .preview-tab-close,
    .preview-tab.active .preview-tab-close {
      opacity: 1;
    }

    .preview-tab-close:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .preview-header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .preview-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 90px;
      overflow: hidden;
    }

    .preview-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .preview-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .preview-toolbar {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .preview-mode-tabs {
      display: none;
      align-items: center;
      background: var(--bg-tertiary);
      border-radius: 5px;
      padding: 1px;
      margin-right: 2px;
    }

    .preview-mode-tabs.visible {
      display: inline-flex;
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-ui);
      font-size: 11.5px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1.3;
    }

    .mode-tab.active {
      background: var(--bg-primary);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    .preview-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      margin: 0;
      user-select: text;
      color: var(--text-primary);
      background: var(--bg-primary);
    }

    /* Code viewer table (+2px font size) */
    .code-view {
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      padding: 8px 0;
      min-width: 100%;
    }

    .code-line {
      display: flex;
      padding: 0 10px 0 0;
    }

    .code-line:hover {
      background: var(--bg-secondary);
    }

    .code-ln {
      user-select: none;
      -webkit-user-select: none;
      text-align: right;
      padding: 0 10px 0 8px;
      min-width: 46px;
      color: var(--text-tertiary);
      opacity: 0.75;
      flex-shrink: 0;
      border-right: 1px solid var(--border-secondary);
      margin-right: 10px;
    }

    .code-lc {
      white-space: pre;
      flex: 1;
      tab-size: 2;
    }

    .code-view.wrap .code-lc {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .syn-kw { color: var(--syn-kw); font-weight: 600; }
    .syn-str { color: var(--syn-str); }
    .syn-num { color: var(--syn-num); }
    .syn-cmt { color: var(--syn-cmt); font-style: italic; }
    .syn-key { color: var(--syn-key); }

    /* Markdown viewer (+2px font size) */
    .md-view {
      padding: 14px 18px 28px 18px;
      font-family: var(--font-ui);
      font-size: 15.5px;
      line-height: 1.7;
      color: var(--text-primary);
      overflow-wrap: break-word;
    }

    .md-view h1,
    .md-view h2,
    .md-view h3,
    .md-view h4,
    .md-view h5,
    .md-view h6 {
      margin: 1.1em 0 0.5em 0;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .md-view h1:first-child,
    .md-view h2:first-child,
    .md-view h3:first-child {
      margin-top: 0;
    }

    .md-view h1 {
      font-size: 1.45em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border-primary);
    }

    .md-view h2 {
      font-size: 1.25em;
      padding-bottom: 0.25em;
      border-bottom: 1px solid var(--border-secondary);
    }

    .md-view h3 { font-size: 1.1em; }
    .md-view h4 { font-size: 1em; }

    .md-view p {
      margin: 0.6em 0;
    }

    .md-view ul,
    .md-view ol {
      margin: 0.5em 0;
      padding-left: 1.5em;
    }

    .md-view li {
      margin: 0.25em 0;
    }

    .md-view blockquote {
      margin: 0.7em 0;
      padding: 4px 12px;
      border-left: 3px solid var(--accent);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border-radius: 0 4px 4px 0;
    }

    .md-view code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      padding: 1.5px 5px;
      border-radius: 4px;
      background: var(--bg-tertiary);
    }

    .md-view pre {
      margin: 0.75em 0;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.55;
    }

    .md-view pre code {
      padding: 0;
      background: transparent;
      font-size: inherit;
    }

    .md-view table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.85em 0;
      font-size: 14.5px;
    }

    .md-view th,
    .md-view td {
      border: 1px solid var(--border-primary);
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
    }

    .md-view th {
      background: var(--bg-secondary);
      font-weight: 600;
    }

    .md-view tr:nth-child(even) td {
      background: rgba(128, 128, 128, 0.04);
    }

    .md-view hr {
      border: none;
      border-top: 1px solid var(--border-primary);
      margin: 1.2em 0;
    }

    .md-view a {
      color: var(--accent);
      text-decoration: none;
    }

    .md-view a:hover {
      text-decoration: underline;
    }

    /* Unsupported / Binary file centered view (matches AGY native prompt) */
    .unsupported-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 240px;
      padding: 24px;
      gap: 14px;
      text-align: center;
      user-select: none;
    }

    .unsupported-text {
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .unsupported-btn {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-primary);
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .unsupported-btn:hover {
      background: var(--bg-secondary);
      border-color: var(--text-tertiary);
    }

    /* Image viewer */
    .img-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100%;
      gap: 10px;
    }

    .img-frame {
      max-width: 100%;
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      padding: 8px;
      background-image:
        linear-gradient(45deg, rgba(128, 128, 128, 0.12) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(128, 128, 128, 0.12) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(128, 128, 128, 0.12) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(128, 128, 128, 0.12) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }

    .img-frame img {
      display: block;
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
    }

    .img-caption {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-tertiary);
    }

    /* Context Menu */
    .ctx-menu {
      position: fixed;
      z-index: 9999;
      min-width: 204px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      box-shadow: var(--menu-shadow);
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .ctx-menu.open {
      display: flex;
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 8px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
    }

    .ctx-item:hover {
      background: var(--bg-tertiary);
    }

    .ctx-sep {
      height: 1px;
      margin: 3px 4px;
      background: var(--border-primary);
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateY(12px);
      max-width: 90%;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-primary);
      color: var(--text-primary);
      font-size: 12px;
      box-shadow: var(--menu-shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s, transform 0.16s;
      z-index: 10000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="header-row">
        <select id="projectSelect" class="project-select" title="Switch Project"></select>
        <button id="btnOpenMode" class="icon-btn mode-btn active" title="Switch file open mode (Split Viewer / AGY Native Tab)">Split</button>
        <button id="btnLang" class="icon-btn lang-btn" title="Switch language (English / 中文)">EN</button>
        <button id="btnAllMode" class="icon-btn" title="Toggle: All Projects / Single Project View">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          </svg>
        </button>
        <button id="btnCollapseAll" class="icon-btn" title="Collapse All">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 20 5-5 5 5"></path>
            <path d="m7 4 5 5 5-5"></path>
          </svg>
        </button>
        <button id="btnToggleHidden" class="icon-btn active" title="Show/Hide Dotfiles (starting with .)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <button id="btnRefresh" class="icon-btn" title="Refresh Directory">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 16h5v5"></path>
          </svg>
        </button>
      </div>
      <div class="header-row">
        <div class="search-wrap">
          <span class="search-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
          </span>
          <input id="searchInput" class="search-input" type="text" placeholder="Fuzzy search file name or path..." />
          <div class="search-controls">
            <button id="searchClear" class="search-clear" title="Clear Search">&times;</button>
            <button id="btnFuzzy" class="search-opt-btn active" title="Fuzzy Match — exact substring match when off">~</button>
            <button id="btnCase" class="search-opt-btn" title="Match Case">Aa</button>
            <button id="btnRegex" class="search-opt-btn" title="Use Regular Expression">.*</button>
          </div>
        </div>
      </div>
      <div class="subbar">
        <span id="subbarPath" class="subbar-path">Loading projects...</span>
        <span id="subbarBadge" class="badge"></span>
      </div>
    </div>

    <div id="mainSplit" class="main">
      <div id="previewPane" class="preview-pane">
        <div id="previewTabsBar" class="preview-tabs"></div>
        <div class="preview-header">
          <div class="preview-title-wrap">
            <span id="previewTitle" class="preview-title"></span>
            <span id="previewMeta" class="preview-meta"></span>
          </div>
          <div class="preview-toolbar">
            <div id="previewModeTabs" class="preview-mode-tabs">
              <button id="btnModeRender" class="mode-tab active">Preview</button>
              <button id="btnModeRaw" class="mode-tab">Raw</button>
            </div>
            <button id="btnPreviewWrap" class="mini-btn" title="Toggle Word Wrap">Wrap</button>
            <button id="btnPreviewCopyContent" class="mini-btn" title="Copy Content">Copy</button>
            <button id="btnPreviewCopyRel" class="mini-btn" title="Copy Relative Path">Rel</button>
            <button id="btnPreviewCopyAbs" class="mini-btn" title="Copy Full Path">Abs</button>
            <button id="btnPreviewOpenNative" class="mini-btn" title="Open in AGY Native Tab">AGY Tab</button>
            <button id="btnPreviewClose" class="icon-btn" style="width:22px;height:22px" title="Close Viewer">&times;</button>
          </div>
        </div>
        <div id="previewBody" class="preview-body"></div>
      </div>

      <div id="previewResizer" class="preview-resizer" title="Drag to resize right file tree width"></div>

      <div id="treeContainer" class="tree-scroll">
        <div class="empty-state">Connecting to Workspace Explorer...</div>
      </div>
    </div>
  </div>

  <div id="ctxMenu" class="ctx-menu"></div>
